spring:
  application:
    name: analyst-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    default: local
  mongodb:
    database: ${SPRING_DATA_MONGODB_DATABASE:analyst}
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/analyst}
    auto-index-creation: true
  data:
    mongodb:
      auto-index-creation: true

springdoc:
  api-docs:
    enabled: true
    resolve-extensions-properties: true
    resolve-schema-properties: true
  show-actuator: true
  swagger-ui:
    syntax-highlight:
      activated: true

management:
  info:
    process:
      enabled: true
    git:
      mode: full
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mongo:
      enabled: true
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      roles: "PERM_HEALTH_READ,PERM_HEALTH_WRITE"
    metrics:
      access: read_only
    info:
      access: read_only
    prometheus:
      access: read_only
    logfile:
      access: read_only
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - caches
          - strato-metrics
          - prometheus
          - logfile
      base-path: /api/management

logging:
  file:
    name: "./la.log"

analyst:
  jwt:
    issuer: learning-analyst
    expiry-seconds: 1800
  admin:
    email: ${ANALYST_ADMIN_EMAIL:admin@local.test}
    username: ${ANALYST_ADMIN_USERNAME:admin}
    password: ${ANALYST_ADMIN_PASSWORD:ChangeMe123!}
  frontend:
    base-url: ${ANALYST_FRONTEND_BASE_URL:http://localhost:5173}